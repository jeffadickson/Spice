name: reference-engine
on: [push, pull_request]
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.402'
      - run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt,clippy,llvm-tools-preview
      - name: Verify coverage prerequisites
        run: ./scripts/Test-Coverage.ps1 -CheckPrerequisitesOnly
      - name: Check missing-tool diagnostics and cleanup
        run: ./scripts/Test-CoveragePrerequisites.ps1
      - run: ./scripts/Test.ps1
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - name: Measure Rust coverage
        run: ./scripts/Test-Coverage.ps1
      - name: Retain coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-${{ matrix.os }}
          path: |
            build/coverage/
          if-no-files-found: warn

