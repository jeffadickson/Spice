[package]
name = "circuit-simulator"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
publish = false
[features]
intel-opencl = ["dep:spice-intel-host"]
# Opt-in aggregation of existing integration tests for mutation throughput only.
mutation-suite = []

[[test]]
name = "mutation_suite"
path = "tests/mutation_suite.rs"
required-features = ["mutation-suite"]

[dependencies]
spice-intel-host = { path = "native/intel-host", optional = true }
spice-bsim330-host = { path = "native/bsim330-host" }
nalgebra = { version = "=0.34.1", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
# Preserve binary64 coordinates across the managed/native JSON boundary.
serde_json = { version = "1", features = ["float_roundtrip"] }
num-complex = { version = "0.4", features = ["serde"] }
sha2 = "0.10"
faer = { version = "=0.24.4", default-features = false, features = ["std", "sparse-linalg"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
[lints.rust]
unsafe_code = "forbid"

# Mutation runs rebuild the owned crate repeatedly. Avoid expensive per-binary
# debug symbols while preserving unoptimized checks and normal test assertions.
# Product and ordinary qualification profiles are unchanged.
[profile.mutants]
inherits = "dev"
debug = 0
incremental = false
codegen-units = 16

[dev-dependencies]
proptest = { version = "=1.9.0", default-features = false, features = ["std"] }

